version: '3.8'

services:
  # 1. PostgreSQL データベースサービス
  postgres-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: rimodeck
      POSTGRES_PASSWORD: rimodeck
      POSTGRES_DB: rimodeckdb
      TZ: Asia/Tokyo
    volumes:
      - ./database/db-data:/var/lib/postgresql

  # 2. Go バックエンドサーバーサービス（API）
  go-server:
    hostname: go-server
    build:
      context: ./go-server
      dockerfile: ./dockerfile
      target: develop
    container_name: go-server
    image: go-server:latest
    restart: always
    tty: true
    ports:
      - "6060:6060" # 開発用ポート
      - "1323:1323"
    volumes:
      - ./go-server/src:/app/src 

