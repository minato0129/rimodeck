services:
  # 1. PostgreSQL データベースサービス
  postgres-db:
    image: postgres:latest
    env_file:
      - ./database/config/postgres.env # database/config/postgres.env.example をコピーして作成(./scripts/setup-env.sh)
    ports:
      - "5432:5432" # ホストから go run で接続する場合に使用
    volumes:
      - ./database/db-data:/var/lib/postgresql

  # 2. Go バックエンドサーバーサービス（API）
  go-server:
    hostname: go-server
    build:
      context: ./go-server
      dockerfile: ./dockerfile
      target: develop
    container_name: go-server
    image: go-server:latest
    restart: always
    env_file:
      - ./go-server/src/config/go-server.env # go-server.env.example をコピーして作成(./scripts/setup-env.sh)
    depends_on:
      - postgres-db
    tty: true
    ports:
      - "6060:6060" # 開発用ポート
      - "1323:1323"
    volumes:
      - ./go-server/src:/app/src 

  # 3. React フロントエンド(Vite 開発サーバー)
  react-app:
    build:
      context: ./react-app
      dockerfile: ./dockerfile
      target: develop
    container_name: react-app
    restart: always
    env_file:
      - ./react-app/config/react-app.env # react-app.env.example をコピーして作成(./scripts/setup-env.sh)
    ports:
      - "3000:3000"
    volumes:
      - ./react-app:/app
      - /app/node_modules # ホストの node_modules でコンテナ側を上書きしない
    depends_on:
      - go-server
