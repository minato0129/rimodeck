<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>りもでっく</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-blue': '#1e88e5', 
                        'bg-light': '#f5f7fa',
                        'text-dark': '#3c4043',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <link rel="stylesheet" href="/assets/css/index.css">
</head>
<body class="bg-bg-light font-sans min-h-screen">

    <header class="bg-white shadow-md">
        <div class="container mx-auto flex h-16 items-center justify-between px-6">
            <div class="flex items-center">
                <img src="/assets/logos/logo-light.svg" alt="rimodeck" class="h-8">
            </div>
            <div class="flex items-center space-x-4">
                <label for="pdf-upload-input" class="flex items-center rounded-full bg-primary-blue px-4 py-2 text-sm font-semibold text-white shadow-lg hover:bg-blue-700 transition duration-150 cursor-pointer" id="upload-label">
                    <span class="material-symbols-outlined text-base mr-1">cloud_upload</span>
                    プレゼンテーションをアップロード
                </label>
                <input type="file" id="pdf-upload-input" accept="application/pdf" style="display: none;" onchange="uploadFile(this.files[0])">

                <!-- プロフィールドロップダウン -->
                <div class="relative profile-menu">
                    <button id="profile-menu-button" class="h-10 w-10 rounded-full flex items-center justify-center text-gray-600 hover:bg-gray-100 transition duration-150 focus:outline-none border border-gray-200">
                        <span class="material-symbols-outlined">person</span>
                    </button>
                    <div id="profile-dropdown" class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl py-2 ring-1 ring-black ring-opacity-5 hidden z-50">
                        <div class="px-4 py-2 border-b border-gray-100 mb-1">
                            <p class="text-xs text-gray-500">ログイン中</p>
                            <p id="display-username" class="text-sm font-bold text-gray-800 truncate"></p>
                        </div>
                        <button onclick="logout()" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition duration-150 flex items-center">
                            <span class="material-symbols-outlined text-sm mr-2">logout</span>
                            ログアウト
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-6 py-8">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-semibold text-text-dark">マイプレゼンテーション</h1>
            
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <input type="text" id="pdf-search-input" placeholder="検索..." class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-primary-blue focus:border-primary-blue w-64 text-sm">
                    <span class="material-symbols-outlined absolute left-2 top-1/2 -translate-y-1/2 text-gray-400 text-lg">search</span>
                </div>
                <div class="flex border border-gray-300 rounded-lg overflow-hidden bg-white">
                    <button id="view-grid-btn" class="p-2 bg-gray-100 text-primary-blue hover:bg-gray-200 transition-colors">
                        <span class="material-symbols-outlined text-lg">grid_view</span>
                    </button>
                    <button id="view-list-btn" class="p-2 text-gray-500 hover:bg-gray-100 transition-colors">
                        <span class="material-symbols-outlined text-lg">view_list</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="pdf-list-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
            <div id="loading-pdfs" class="col-span-full text-center py-10 text-gray-500">
                <p class="mb-2"><span class="material-symbols-outlined animate-spin text-xl">progress_activity</span></p>
                <p>ファイル一覧を読み込み中...</p>
            </div>
        </div>
        
        <p class="mt-8 text-sm text-red-500 hidden" id="pdf-error-message"></p>
    </main>

    <script type="module" src="/assets/js/index.js"></script>
</body>
</html>
