<!DOCTYPE html>
<html class="light" lang="ja">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>りもでっく</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#1e88e5",
                        "primary-blue": "#1e88e5",
                        secondary: "#f1f1f1",
                        accent: "#e74c3c",
                        "text-primary": "#333333",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                },
            },
        };
    </script>
    <link rel="stylesheet" href="/assets/css/slide.css">
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display flex h-screen flex-col overflow-hidden text-text-primary dark:text-white">

    <header
        class="flex h-16 shrink-0 items-center justify-between border-b border-gray-200 bg-white px-4 dark:border-gray-700 dark:bg-background-dark">
        <div class="flex items-center gap-3">
            <div class="flex items-center space-x-2">
                <img src="/assets/logos/logo-light.svg" alt="rimodeck" class="h-6">
            </div>
            <span id="display-username" class="text-xs text-gray-500 ml-1"></span>
        </div>
        <div class="flex items-center gap-4">
            <span id="page-indicator" class="text-md font-medium text-gray-700 dark:text-gray-300">
                ページ <span id="current-page-num">0</span> / <span id="total-pages">0</span>
            </span>
            <button onclick="logout()" class="text-sm text-gray-500 hover:text-red-500 transition duration-150">ログアウト</button>
            <a href="/"
                class="flex items-center justify-center rounded-lg bg-gray-500 px-3 py-2 text-white transition-colors hover:bg-gray-700">
                <span class="material-symbols-outlined text-xl">folder_open</span>
                <span class="ml-2 hidden text-sm font-medium sm:inline">ファイル選択に戻る</span>
            </a>

            <button
                class="flex items-center justify-center rounded-lg bg-primary px-3 py-2 text-white transition-colors hover:bg-primary/80"
                onclick="document.getElementById('qr-popup').classList.remove('hidden')">
                <span class="material-symbols-outlined text-xl">qr_code_scanner</span>
                <span class="ml-2 hidden text-sm font-medium sm:inline">リモートで操作</span>
            </button>
        </div>
    </header>

    <div class="flex flex-1 min-h-0">

        <main id="presentation-main"
            class="relative flex min-h-0 w-full flex-col overflow-hidden rounded-lg bg-gray-100 dark:bg-background-dark shadow-xl lg:min-h-full">
            <div id="pdf-canvas-container" class="flex flex-1 items-center justify-center p-0">
                <canvas id="pdf-canvas"></canvas>
                <div id="loading-text" class="absolute text-xl font-bold">PDFを読み込み中...</div>
            </div>

        </main>

        <aside
            class="hidden w-80 shrink-0 flex-col gap-4 border-l border-gray-200 bg-background-light p-4 dark:border-gray-700 dark:bg-background-dark lg:flex">
            <div class="border-t border-gray-200 pt-4 dark:border-gray-700">
                <h3 class="text-lg font-semibold mb-2">スライドメモ</h3>
                <details class="group" open>
                    <summary
                        class="flex cursor-pointer items-center justify-between rounded-lg bg-secondary/50 p-2 text-sm font-medium transition-colors hover:bg-secondary/70 dark:bg-background-dark/50 dark:hover:bg-background-dark/70">
                        メモ
                        <span
                            class="material-symbols-outlined transition-transform group-open:rotate-180">expand_more</span>
                    </summary>
                    <textarea id="slide-note"
                        class="mt-2 w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-transparent p-2 text-sm font-normal text-text-primary focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary"
                        placeholder="このスライドに関するメモを追加..." rows="25">
                    </textarea>
                </details>
            </div>
        </aside>

    </div>

    <div class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50" id="qr-popup">
        <div class="relative w-full max-w-sm rounded-xl bg-white dark:bg-background-dark p-8 shadow-lg">
            <button
                class="absolute top-4 right-4 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200"
                onclick="document.getElementById('qr-popup').classList.add('hidden')">
                <span class="material-symbols-outlined">close</span>
            </button>
            <div class="flex flex-col items-center gap-6 text-center">
                <h2 class="text-2xl font-bold text-text-primary dark:text-white">サーバーと接続</h2>
                <p class="text-sm text-gray-600 dark:text-gray-400">
                    スマートフォンでQRコードを <br>
                    スキャンして接続してください
                </p>
                <div id="qr-code-container"
                    class="h-64 w-64 flex items-center justify-center bg-white p-2 border border-gray-200 rounded-lg">
                    <p class="text-xs text-gray-400">QRコードを生成中...</p>
                </div>

                <div class="flex w-full items-center justify-center rounded-lg bg-yellow-500/20 p-2 text-sm font-medium text-yellow-700 dark:text-yellow-300"
                    id="connection-status">
                    <span class="mr-2 h-2.5 w-2.5 rounded-full bg-yellow-500"></span>
                    <span id="status-text">接続IDを発行中...</span>
                </div>
                <!-- <p class="text-xs text-gray-500 dark:text-gray-400" id="viewer-id-display">ID: (接続後に表示)</p> -->
            </div>
        </div>
    </div>

    <div id="click-overlay"
        class="fixed inset-0 z-[100] hidden cursor-pointer bg-black/70 text-white flex items-center justify-center"
        onclick="handleFullscreenToggle()">
        <div class="text-center p-8 border border-white rounded-xl">
            <span class="material-symbols-outlined text-6xl mb-4">computer</span>
            <p class="text-xl font-bold">プレゼンテーションを開始/終了するには、<br>この画面をクリックしてください</p>
            <p class="text-sm mt-2">（ブラウザのセキュリティ制限のため）</p>
        </div>
    </div>

    <script type="module" src="/assets/js/slide.js"></script>
    <script nomodule>
        // ブラウザがES Modulesをサポートしていない場合へのフォールバック
    </script>
</body>

</html>
