<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>りもでっく</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#007AFF",
                        "background-light": "#f0f2f5",
                        "background-dark": "#1C2541",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<link rel="stylesheet" href="/assets/css/phone.css">
</head>

<body class="bg-background-light dark:bg-background-dark flex h-auto min-h-screen w-full flex-col">

<div class="flex items-center p-4 pb-2 justify-between bg-background-light">
    <div class="flex size-12 shrink-0 items-center">
        <span class="material-symbols-outlined text-gray-800 text-3xl">arrow_back_ios_new</span>
    </div>
    <h2 class="text-gray-800 text-xl font-bold tracking-tight">プレゼンテーション リモート</h2>
    <div class="flex w-12 items-center justify-end">
        <button class="flex items-center justify-center rounded-lg h-12 text-gray-800 p-0">
            <span class="material-symbols-outlined text-3xl">settings</span>
        </button>
    </div>
</div>

<button id="fullscreen-toggle-button" class="p-4 bg-primary text-white font-bold hover:bg-primary/80 transition-colors">プレゼンテーションモードに変更</button>
<div class="p-4 pt-2">
    <div id="remote-status" class="flex w-full items-center justify-center rounded-lg bg-yellow-500/20 p-2 text-sm font-medium text-yellow-700 dark:text-yellow-300">
        <span class="mr-2 h-2.5 w-2.5 rounded-full bg-yellow-500"></span>
        <span>接続待機中...</span>
    </div>
</div>

<div class="flex-grow flex justify-between items-stretch p-4 gap-4">
    <button id="prev-button" class="flex flex-col items-center justify-center gap-4 rounded-xl bg-white text-gray-700 flex-1 shadow-lg active:shadow-none active:bg-gray-100 transition-all">
        <span class="material-symbols-outlined text-gray-500" style="font-size: 48px;">arrow_back_ios</span>
        <span class="text-lg font-bold">前のスライド</span>
    </button>
    <button id="next-button" class="flex flex-col items-center justify-center gap-4 rounded-xl bg-white text-gray-700 flex-1 shadow-lg active:shadow-none active:bg-gray-100 transition-all">
        <span class="material-symbols-outlined text-gray-500" style="font-size: 48px;">arrow_forward_ios</span>
        <span class="text-lg font-bold">次のスライド</span>
    </button>
</div>

<script src="/assets/js/phone.js"></script>
</body>
</html>
