<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 - りもでっく</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-blue': '#1e88e5', 
                        'bg-light': '#f5f7fa',
                        'text-dark': '#3c4043',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-bg-light font-sans min-h-screen flex items-center justify-center px-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
            <div class="flex items-center justify-center mb-4">
                <img src="/assets/logos/logo-light.svg" alt="rimodeck" class="h-16">
            </div>
            <p class="text-gray-500">新しいアカウントを作成します</p>
        </div>

        <form id="signup-form" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">ユーザー名</label>
                <input type="text" id="username" name="username" required 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-blue focus:border-primary-blue outline-none transition duration-150">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">パスワード</label>
                <input type="password" id="password" name="password" required 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-blue focus:border-primary-blue outline-none transition duration-150">
            </div>

            <div id="message" class="text-sm hidden"></div>

            <button type="submit" id="submit-btn"
                class="w-full bg-primary-blue text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition duration-150 shadow-md">
                アカウント作成
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
            すでにアカウントをお持ちですか？ 
            <a href="/login" class="text-primary-blue font-semibold hover:underline">ログイン</a>
        </div>
    </div>

    <script src="/assets/js/signup.js"></script>
</body>
</html>
