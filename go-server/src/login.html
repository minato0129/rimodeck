<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - りもでっく</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-blue': '#1e88e5', 
                        'bg-light': '#f5f7fa',
                        'text-dark': '#3c4043',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-bg-light font-sans min-h-screen flex items-center justify-center px-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-primary-blue mb-2">りもでっく</h1>
            <p class="text-gray-500">アカウントにログインしてください</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">ユーザー名</label>
                <input type="text" id="username" name="username" required 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-blue focus:border-primary-blue outline-none transition duration-150">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">パスワード</label>
                <input type="password" id="password" name="password" required 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-blue focus:border-primary-blue outline-none transition duration-150">
            </div>

            <div id="error-message" class="text-red-500 text-sm hidden"></div>

            <button type="submit" id="submit-btn"
                class="w-full bg-primary-blue text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition duration-150 shadow-md">
                ログイン
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
            アカウントをお持ちでないですか？ 
            <a href="/signup" class="text-primary-blue font-semibold hover:underline">新規登録</a>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errorEl = document.getElementById('error-message');
            
            btn.disabled = true;
            btn.textContent = 'ログイン中...';
            errorEl.classList.add('hidden');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    // ログイン成功
                    localStorage.setItem('username', username);
                    window.location.href = '/';
                } else {
                    const msg = await response.text();
                    errorEl.textContent = 'ログインに失敗しました。ユーザー名またはパスワードが正しくありません。';
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.textContent = 'ネットワークエラーが発生しました。';
                errorEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'ログイン';
            }
        });
    </script>
</body>
</html>
