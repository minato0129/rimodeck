# 本番用: React のビルド結果(静的ファイル)を HTTPS で配信し、API・WebSocket・PDF は Go サーバーに中継する。
# 証明書は /etc/nginx/certs/ に置く(fullchain.pem と privkey.pem。README の「HTTPS」を参照)。
# 画面と API が同じオリジンになるので、Cookie と CORS の問題は起きない。
# (開発用の Vite 開発サーバーの中継 = react-app/vite.config.ts と同じ振り分け)

# WebSocket の Upgrade ヘッダーを中継するための対応表
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP(80)は、HTTPS(443)へ転送する
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # PDF のアップロードを受けられるようにする(既定の 1MB では足りない)
    client_max_body_size 100m;

    # go-server が起動する前でも nginx を起動できるよう、名前は都度 Docker の DNS で引く
    resolver 127.0.0.11 valid=10s;
    set $api http://go-server:1323;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # --- Go サーバーへ中継するもの ---
    location ~ ^/(logout|upload|pdfs|delete-pdf|note)$ {
        proxy_pass $api;
    }

    # ユーザーの PDF
    location /assets/ {
        proxy_pass $api;
    }

    # PC とスマホの通信(WebSocket)。切れにくいよう、読み取りの待ち時間を長くする
    location = /ws {
        proxy_pass $api;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # /login と /signup は、ページ(GET)と API(POST)で同じ URL。POST だけ Go へ、それ以外は画面を返す
    location ~ ^/(login|signup)$ {
        error_page 418 = @api;
        if ($request_method = POST) {
            return 418;
        }
        try_files /index.html =404;
    }

    location @api {
        proxy_pass $api;
    }

    # --- React の画面 ---
    # ビルドで出るファイル名にはハッシュが付くので、長くキャッシュしてよい
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PDF 表示用のワーカー(.mjs)が JavaScript として返るようにする(nginx の対応表に無い場合の保険)
    location ~* ^/static/.*\.mjs$ {
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html はキャッシュしない(新しいビルドをすぐ使えるように)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # /, /viewer, /remote など、画面のパスはすべて index.html(React Router が描き分ける)
    location / {
        try_files $uri /index.html;
    }
}
