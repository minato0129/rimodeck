# 本番用の構成(LAN 内で使う前提の HTTP)。起動:
#   docker compose -f docker-compose.production.yaml up -d --build
# 開発用の docker-compose.yaml とは別のファイルで、同時には起動しない(80 番を nginx が使う)。
services:
  postgres-db:
    image: postgres:latest
    env_file:
      - ./env/postgres.env # env/postgres.env.example をコピーして作成(./scripts/setup-env.sh)
    restart: always
    volumes:
      - ./database/db-data:/var/lib/postgresql

  # Go サーバー(API・WebSocket・PDF)。外には公開せず、nginx からだけ呼ぶ
  go-server:
    hostname: go-server
    build:
      context: ./go-server
      dockerfile: ./dockerfile
      target: production
    restart: always
    env_file:
      - ./env/go-server.env # env/go-server.env.example をコピーして作成(./scripts/setup-env.sh)
    depends_on:
      - postgres-db
    volumes:
      - prod-assets:/assets # PDF 生成用のフォントなどを共有するためのボリューム

  # nginx: React のビルド結果を配信し、API を go-server へ中継する
  web:
    build:
      context: ./react-app
      dockerfile: ./dockerfile
      target: production
    restart: always
    ports:
      - "80:80"
    depends_on:
      - go-server

volumes:
  prod-assets: